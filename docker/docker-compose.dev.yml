# Dev: code trên máy mount vào container — backend nodemon + frontend/admin Vite HMR.
# Chạy: docker compose -f docker-compose.dev.yml up -d --build
#
# MongoDB: đặt MONGODB_URI trong docker/.env (vd. Atlas). Muốn Mongo trong Docker,
# bỏ comment service mongo + volume mongo_data_dev + depends_on ở backend.

services:
  # Bỏ comment nếu cần Mongo cục bộ (và đặt MONGODB_URI=mongodb://mongo:27017)
  # mongo:
  #   image: mongo:7
  #   restart: unless-stopped
  #   volumes:
  #     - mongo_data_dev:/data/db
  #   ports:
  #     - "27017:27017"
  #   healthcheck:
  #     test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10
  #     start_period: 10s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: development
      PORT: "4000"
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_me}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      VNP_TMN_CODE: ${VNP_TMN_CODE:-}
      VNP_HASH_SECRET: ${VNP_HASH_SECRET:-}
      VNP_URL: ${VNP_URL:-}
      VNP_RETURN_URL: ${VNP_RETURN_URL:-http://localhost:4000/api/order/vnpay-return}
    volumes:
      - ../backend:/app
      - backend_node_modules:/app/node_modules
    command: sh -c "npm install && exec npm run server"
    # depends_on:
    #   mongo:
    #     condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:4000}
      VITE_R2_PUBLIC_BASE_URL: ${VITE_R2_PUBLIC_BASE_URL:-}
      VITE_R2_BUCKET: ${VITE_R2_BUCKET:-}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && exec npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "5174:5174"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:4000}
      VITE_FRONTEND_URL: ${VITE_FRONTEND_URL:-http://localhost:5173}
      VITE_R2_PUBLIC_BASE_URL: ${VITE_R2_PUBLIC_BASE_URL:-}
      VITE_R2_BUCKET: ${VITE_R2_BUCKET:-}
    volumes:
      - ../admin:/app
      - admin_node_modules:/app/node_modules
    command: sh -c "npm install && exec npm run dev -- --host 0.0.0.0 --port 5174"
    depends_on:
      - backend

volumes:
  # mongo_data_dev:
  backend_node_modules:
  frontend_node_modules:
  admin_node_modules:
